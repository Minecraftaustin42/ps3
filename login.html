<!DOCTYPE html>
<html><head><title>Login - Playsculpt</title><style>
body { margin: 0; font-family: Verdana; background: #2b2d6e; color: white; }
.header { background: #1f1f5a; padding: 10px; border-bottom: 3px solid black; font-size: 20px; }
.wrapper { width: 900px; margin: 40px auto; display: flex; gap: 20px; }
.side { width: 250px; background: #3a3cc9; border: 2px solid black; padding: 15px; }
.main { flex: 1; background: #3a3cc9; border: 2px solid black; }
.box-header { background: #23257a; padding: 10px; border-bottom: 2px solid black; font-weight: bold; }
.box-content { padding: 15px; }
input,.button { width: 95%; padding: 8px; margin: 6px 0; border: 2px solid black; }
.button { background:#5a5dff; color:white; cursor:pointer; font-weight:bold; }
.hidden {display:none;}
</style></head><body>
<div class="header">Playsculpt</div><div class="wrapper"><div class="side"><b>Welcome Back</b></div>
<div class="main"><div class="box-header">Login</div><div class="box-content">
<input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button class="button" onclick="login()">Login</button>
<div id="verify-area" class="hidden">
<hr><b>Suspicious login attempt</b><p>We sent a 6-digit code to your linked email. Enter it below to continue.</p>
<input id="verify-email-code" placeholder="Email 6-digit code">
<button class="button" onclick="verifyLogin()">Verify & Continue</button>
</div>
<div id="msg"></div><a href="signup.html" style="color:white;">Create account</a>
</div></div></div>
<script>
async function login(){const msg=document.getElementById('msg');const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value.trim();msg.innerText='Logging in...';const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await res.json();if(data.requiresVerification){document.getElementById('verify-area').classList.remove('hidden');msg.style.color='white';msg.innerText='New IP detected. Check your email for a 6-digit code.';return;}msg.style.color=res.ok?'lightgreen':'red';msg.innerText=res.ok?'Success! Redirecting...':data.error;if(res.ok)setTimeout(()=>window.location.href='/platform.html',500);}
async function verifyLogin(){const msg=document.getElementById('msg');const emailCode=document.getElementById('verify-email-code').value.trim();const res=await fetch('/login/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emailCode})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=res.ok?'Verification successful! Redirecting...':data.error;if(res.ok)setTimeout(()=>window.location.href='/platform.html',500);}
</script></body></html>
