<!DOCTYPE html>
<html>
<head>
<title>Login - Playsculpt</title>
<style>
body { margin: 0; font-family: Verdana; background: #2b2d6e; color: white; }
.header { background: #1f1f5a; padding: 10px; border-bottom: 3px solid black; font-size: 20px; }
.wrapper { width: 900px; margin: 40px auto; display: flex; gap: 20px; }
.side { width: 250px; background: #3a3cc9; border: 2px solid black; padding: 15px; }
.main { flex: 1; background: #3a3cc9; border: 2px solid black; }
.box-header { background: #23257a; padding: 10px; border-bottom: 2px solid black; font-weight: bold; }
.box-content { padding: 15px; }
input { width: 95%; padding: 8px; margin: 6px 0; border: 2px solid black; }
.button { width: 100%; padding: 10px; background: #5a5dff; border: 2px solid black; color: white; cursor: pointer; font-weight: bold; }
.button:hover { background: #787aff; }
.msg { margin-top: 10px; font-size: 14px; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="header">Playsculpt</div>
<div class="wrapper">
    <div class="side">
        <b>Welcome Back</b>
        <p>Log in to continue building, playing, and exploring.</p>
        <hr>
        <p>✔ Access your games</p>
        <p>✔ Join friends</p>
        <p>✔ Continue progress</p>
    </div>
    <div class="main">
        <div class="box-header">Login</div>
        <div class="box-content">
            <input id="username" placeholder="Username">
            <input id="password" type="password" placeholder="Password">
            <button class="button" onclick="login()">Login</button>

            <div id="verify-area" class="hidden">
                <hr>
                <b>New device/IP verification</b>
                <p>Please re-enter your password. If your account has a backup security code, enter that too.</p>
                <input id="verify-password" type="password" placeholder="Re-enter password">
                <input id="verify-backup-code" placeholder="Backup code (if enabled)">
                <button class="button" onclick="verifyLogin()">Verify & Continue</button>
            </div>

            <div id="msg" class="msg"></div>
            <br>
            <a href="signup.html" style="color:white;">Create account</a>
        </div>
    </div>
</div>

<script>
let requireBackupCode = false;

async function login() {
    const msg = document.getElementById("msg");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    msg.style.color = "white";
    msg.innerText = "Logging in...";

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.requiresVerification) {
            requireBackupCode = Boolean(data.requiresBackupCode);
            document.getElementById("verify-area").classList.remove("hidden");
            document.getElementById("verify-backup-code").style.display = requireBackupCode ? "block" : "none";
            msg.style.color = "orange";
            msg.innerText = "New IP detected. Complete verification below.";
            return;
        }

        if (!res.ok) {
            msg.style.color = "red";
            msg.innerText = data.error;
        } else {
            msg.style.color = "lightgreen";
            msg.innerText = "Success! Redirecting...";
            setTimeout(() => { window.location.href = "/platform.html"; }, 600);
        }
    } catch {
        msg.style.color = "red";
        msg.innerText = "Server error";
    }
}

async function verifyLogin() {
    const msg = document.getElementById("msg");
    const password = document.getElementById("verify-password").value.trim();
    const backupCode = document.getElementById("verify-backup-code").value.trim();

    if (!password) {
        msg.style.color = "red";
        msg.innerText = "Re-enter your password.";
        return;
    }

    if (requireBackupCode && !backupCode) {
        msg.style.color = "red";
        msg.innerText = "Backup security code is required for this account.";
        return;
    }

    msg.style.color = "white";
    msg.innerText = "Verifying...";

    try {
        const res = await fetch("/login/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ password, backupCode })
        });
        const data = await res.json();

        if (!res.ok) {
            msg.style.color = "red";
            msg.innerText = data.error;
        } else {
            msg.style.color = "lightgreen";
            msg.innerText = "Verification successful! Redirecting...";
            setTimeout(() => { window.location.href = "/platform.html"; }, 600);
        }
    } catch {
        msg.style.color = "red";
        msg.innerText = "Server error";
    }
}
</script>
</body>
</html>
