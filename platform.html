<!DOCTYPE html>
<html>
<head><title>Playsculpt Platform</title>
<style>
body {font-family: Verdana; background:#2b2d6e; color:white; text-align:center;}
.box {margin:40px auto; width:480px; background:#3a3cc9; border:2px solid black; padding:20px;}
input,button{width:90%;padding:8px;margin:6px 0;border:2px solid black;}
button{background:#5a5dff;color:#fff;cursor:pointer;}
</style></head>
<body>
<div class="box">
<h2>Welcome to Playsculpt</h2><p id="user"></p>
<hr>
<h3>Account Settings</h3>
<p>Optional: link an email for suspicious-login verification codes.</p>
<input id="email" placeholder="Enter email (optional)">
<button onclick="saveEmail()">Save Email & Send Confirmation</button>
<input id="email-code" placeholder="Enter email confirmation code">
<button onclick="confirmEmail()">Confirm Email</button>
<div id="settings-msg"></div>
<hr><a href="/logout" style="color:white;">Logout</a>
</div>
<script>
fetch('/me').then(r=>r.json()).then(d=>{if(!d.user)location.href='/login.html';else document.getElementById('user').innerText='Logged in as: '+d.user;});
async function saveEmail(){const email=document.getElementById('email').value.trim();const msg=document.getElementById('settings-msg');const res=await fetch('/settings/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error;}
async function confirmEmail(){const code=document.getElementById('email-code').value.trim();const msg=document.getElementById('settings-msg');const res=await fetch('/settings/email/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error;}
</script>
</body></html>
