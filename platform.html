<!DOCTYPE html>
<html>
<head>
<title>Playsculpt Platform</title>
<style>
body { font-family: Verdana; background: #2b2d6e; color: white; text-align: center; }
.box { margin: 100px auto; width: 400px; background: #3a3cc9; border: 2px solid black; padding: 20px; }
</style>
</head>
<body>
<div class="box">
    <h2>Welcome to Playsculpt</h2>
    <p id="user"></p>
    <a href="/settings.html" style="color:white;">Settings</a>
    <br><br>
    <a href="/logout" style="color:white;">Logout</a>
</div>
<script>
fetch("/me").then(res => res.json()).then(data => {
    if (!data.user) window.location.href = "/login.html";
    else document.getElementById("user").innerText = "Logged in as: " + data.user;
});
</script>
</body>
</html>
