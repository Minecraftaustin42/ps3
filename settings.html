<!DOCTYPE html>
<html>
<head>
<title>Settings - Playsculpt</title>
<style>
body {font-family: Verdana; background:#2b2d6e; color:white; text-align:center;}
.box {margin:40px auto; width:520px; background:#3a3cc9; border:2px solid black; padding:20px;}
input,button{width:90%;padding:8px;margin:6px 0;border:2px solid black;}
button{background:#5a5dff;color:#fff;cursor:pointer;}
.hidden { display:none; }
</style>
</head>
<body>
<div class="box">
<h2>Account Settings</h2>
<p id="current-email"></p>
<div id="link-email-area">
<input id="email" placeholder="Enter email">
<button onclick="linkEmail()">Link Email & Send Confirmation</button>
<input id="email-code" placeholder="Enter confirmation code">
<button onclick="confirmEmail()">Confirm Email</button>
</div>
<div id="change-email-area" class="hidden">
<h3>Change Email</h3>
<input id="new-email" placeholder="New email">
<input id="current-password" type="password" placeholder="Current password">
<button onclick="changeEmail()">Change Email</button>
<input id="change-email-code" placeholder="Enter code sent to new email">
<button onclick="confirmChangedEmail()">Confirm New Email</button>
</div>
<div id="settings-msg"></div>
<br><a href="/platform.html" style="color:white;">Back to platform</a> | <a href="/logout" style="color:white;">Logout</a>
</div>
<script>
async function loadSettings(){const res=await fetch('/settings/me');const data=await res.json();if(!res.ok){location.href='/login.html';return;}const text=data.emailVerified?`Linked email: ${data.email}`:'No verified email linked.';document.getElementById('current-email').innerText=text;document.getElementById('change-email-area').classList.toggle('hidden',!data.emailVerified);}
async function linkEmail(){const msg=document.getElementById('settings-msg');const email=document.getElementById('email').value.trim();const res=await fetch('/settings/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error;}
async function confirmEmail(){const msg=document.getElementById('settings-msg');const code=document.getElementById('email-code').value.trim();const res=await fetch('/settings/email/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error; if(res.ok) loadSettings();}
async function changeEmail(){const msg=document.getElementById('settings-msg');const newEmail=document.getElementById('new-email').value.trim();const currentPassword=document.getElementById('current-password').value.trim();const res=await fetch('/settings/email/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newEmail,currentPassword})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error;}
async function confirmChangedEmail(){const msg=document.getElementById('settings-msg');const code=document.getElementById('change-email-code').value.trim();const res=await fetch('/settings/email/change/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const data=await res.json();msg.style.color=res.ok?'lightgreen':'red';msg.innerText=data.message||data.error;if(res.ok) loadSettings();}
loadSettings();
</script>
</body>
</html>
