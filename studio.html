<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Playsculpt Studio</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; font-family:Verdana; background:#0f1240; color:#d7dcff; }
    #app { display:grid; grid-template-rows:48px 1fr; height:100%; }
    #toolbar { background:#1b1f64; border-bottom:2px solid #000; display:flex; align-items:center; gap:10px; padding:0 10px; }
    .btn { background:#3943b7; border:2px solid #000; color:#fff; padding:6px 10px; cursor:pointer; }
    #main { display:grid; grid-template-columns:200px 1fr 240px; min-height:0; }
    .panel { background:#171b57; overflow:auto; }
    .title { background:#252b88; padding:8px; border-bottom:2px solid #000; font-weight:bold; }
    .row { padding:8px; border-bottom:1px solid rgba(255,255,255,.1); }
    #viewport-wrap { position:relative; background:#0c1038; }
    #viewport { width:100%; height:100%; display:block; }
    select { width:100%; padding:8px; background:#0d113c; color:#fff; border:1px solid #000; }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <b>Playsculpt Studio</b>
    <button class="btn" onclick="location.href='platform.html'">Back</button>
    <span id="engine-status" style="margin-left:auto;font-size:12px;"></span>
  </div>
  <div id="main">
    <div class="panel"><div class="title">Explorer</div><div id="explorer-list" class="row">Baseplate</div></div>
    <div id="viewport-wrap"><canvas id="viewport"></canvas></div>
    <div class="panel">
      <div class="title">Parts</div>
      <div class="row">
        <select id="part-type">
          <option>Cube</option><option>Sphere</option><option>Cylinder</option><option>Triangle</option><option>WedgePart</option><option>Cone</option>
        </select>
        <button class="btn" style="margin-top:8px;width:100%;" id="add-part-btn">Add Part</button>
      </div>
      <div class="title">Properties</div>
      <div class="row">Select an object</div>
    </div>
  </div>
</div>
<script>
function installTinyThreeFallback(){const noop=()=>{};class V3{constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z;}set(x,y,z){this.x=x;this.y=y;this.z=z;return this;}clone(){return new V3(this.x,this.y,this.z);}add(v){this.x+=v.x;this.y+=v.y;this.z+=v.z;return this;}addScaledVector(v,s){this.x+=v.x*s;this.y+=v.y*s;this.z+=v.z*s;return this;}}class Obj{constructor(){this.position=new V3();this.name='';}}class Scene extends Obj{constructor(){super();this.children=[];this.background=null;}add(o){this.children.push(o);}}class PerspectiveCamera extends Obj{constructor(){super();this.aspect=1;}updateProjectionMatrix(){}lookAt(){}}class WebGLRenderer{constructor(opts){this.domElement=opts.canvas;this.ctx=this.domElement.getContext('2d');}setSize(w,h){this.domElement.width=w;this.domElement.height=h;}render(){const c=this.ctx;if(!c)return;c.fillStyle='#0b0f35';c.fillRect(0,0,this.domElement.width,this.domElement.height);c.fillStyle='#c9d3ff';c.fillText('Tiny fallback renderer active',10,20);}}class Mesh extends Obj{constructor(g,m){super();this.geometry=g;this.material=m;}}class G{}class BoxGeometry extends G{}class SphereGeometry extends G{}class CylinderGeometry extends G{}class ConeGeometry extends G{}class MeshStandardMaterial{constructor(o){this.color=o.color;}}class DirectionalLight extends Obj{}class AmbientLight extends Obj{}class Color{constructor(v){this.value=v;}}window.THREE={Scene,PerspectiveCamera,WebGLRenderer,DirectionalLight,AmbientLight,Mesh,BoxGeometry,SphereGeometry,CylinderGeometry,ConeGeometry,MeshStandardMaterial,Vector3:V3,Color};}
function bootStudio(){if(!window.THREE){installTinyThreeFallback();document.getElementById('engine-status').textContent='Using built-in fallback renderer.';}const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f35);const camera=new THREE.PerspectiveCamera(75,2,0.1,1000);camera.position.set(0,6,16);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('viewport'),antialias:true});const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(8,12,8);scene.add(light);scene.add(new THREE.AmbientLight(0x6677cc,0.7));const base=new THREE.Mesh(new THREE.BoxGeometry(30,1,30),new THREE.MeshStandardMaterial({color:0x3f7fc8}));base.position.y=-0.5;base.name='Baseplate';scene.add(base);let partCount=0;function createGeometry(type){if(type==='Sphere')return new THREE.SphereGeometry(1.2,20,20);if(type==='Cylinder')return new THREE.CylinderGeometry(1,1,2,20);if(type==='Triangle')return new THREE.CylinderGeometry(1.4,1.4,0.6,3);if(type==='WedgePart')return new THREE.CylinderGeometry(0,1.5,2.5,4);if(type==='Cone')return new THREE.ConeGeometry(1.2,2.2,20);return new THREE.BoxGeometry(2,2,2);}function addPart(){const type=document.getElementById('part-type').value;const p=new THREE.Mesh(createGeometry(type),new THREE.MeshStandardMaterial({color:0x9db1ff}));p.position.set(Math.random()*8-4,1,Math.random()*8-4);p.name=type+'_'+(++partCount);scene.add(p);document.getElementById('explorer-list').innerHTML += '<div>'+p.name+'</div>';}document.getElementById('add-part-btn').addEventListener('click',addPart);function resize(){const el=document.getElementById('viewport-wrap');const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();const keys={};window.addEventListener('keydown',e=>keys[e.code]=true);window.addEventListener('keyup',e=>keys[e.code]=false);let yaw=0,pitch=-0.15;let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});window.addEventListener('mouseup',()=>dragging=false);window.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*0.003;pitch=Math.max(-1.4,Math.min(1.4,pitch-dy*0.003));});function updateCam(dt){const sp=12*dt;const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const right=new THREE.Vector3(forward.z,0,-forward.x);if(keys['KeyW'])camera.position.addScaledVector(forward,sp);if(keys['KeyS'])camera.position.addScaledVector(forward,-sp);if(keys['KeyA'])camera.position.addScaledVector(right,-sp);if(keys['KeyD'])camera.position.addScaledVector(right,sp);if(keys['Space'])camera.position.y+=sp;if(keys['ShiftLeft'])camera.position.y-=sp;camera.lookAt(camera.position.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch))));}let prev=performance.now();function loop(now){const dt=(now-prev)/1000;prev=now;updateCam(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}requestAnimationFrame(loop);} 
(function loadThreeWithFallback(){const urls=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"];let i=0;function tryNext(){if(i>=urls.length){bootStudio();return;}const src=urls[i++];const tag=document.createElement("script");tag.src=src;tag.onload=()=>bootStudio();tag.onerror=()=>tryNext();document.body.appendChild(tag);}tryNext();})();
</script>
</body>
</html>
