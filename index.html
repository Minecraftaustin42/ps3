<!DOCTYPE html>
<html>
<head>
<title>Playsculpt</title>

<style>
body {
    margin: 0;
    font-family: Verdana;
    background: #2b2d6e;
    color: white;
}

/* header */
.header {
    background: #1f1f5a;
    padding: 12px;
    border-bottom: 3px solid black;
}

.nav a {
    color: white;
    margin-right: 15px;
    text-decoration: none;
}

.nav a:hover {
    text-decoration: underline;
}

/* main layout */
.wrapper {
    width: 800px;
    margin: 80px auto;
    text-align: center;
}

/* box */
.box {
    background: #3a3cc9;
    border: 2px solid black;
}

.box-header {
    background: #23257a;
    padding: 10px;
    border-bottom: 2px solid black;
    font-weight: bold;
}

.box-content {
    padding: 20px;
}

/* buttons */
.button {
    display: inline-block;
    padding: 12px 25px;
    margin: 10px;
    background: #5a5dff;
    border: 2px solid black;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.button:hover {
    background: #787aff;
}
</style>
</head>

<body>

<div class="header">
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </div>
</div>

<div class="wrapper">
    <div class="box">
        <div class="box-header">Welcome to Playsculpt</div>

        <div class="box-content">
            <h2>Create games. Play games. Build your world.</h2>

            <p>
                Playsculpt is a platform where anyone can create and share games.
                Build worlds, explore creations, and connect with players.
            </p>

            <br>

            <a class="button" href="signup.html">Start Playing</a>
            <a class="button" href="createonplaysculpt.html">Create</a>
        </div>
    </div>
</div>

</body>
</html>
