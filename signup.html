<!DOCTYPE html>
<html>
<head>
<title>Signup - Playsculpt</title>
<style>
body { margin: 0; font-family: Verdana; background: #2b2d6e; color: white; }
.header { background: #1f1f5a; padding: 10px; border-bottom: 3px solid black; font-size: 20px; }
.wrapper { width: 900px; margin: 40px auto; display: flex; gap: 20px; }
.side { width: 250px; background: #3a3cc9; border: 2px solid black; padding: 15px; }
.main { flex: 1; background: #3a3cc9; border: 2px solid black; }
.box-header { background: #23257a; padding: 10px; border-bottom: 2px solid black; font-weight: bold; }
.box-content { padding: 15px; }
input { width: 95%; padding: 8px; margin: 6px 0; border: 2px solid black; }
.button { width: 100%; padding: 10px; background: #5a5dff; border: 2px solid black; color: white; cursor: pointer; font-weight: bold; }
.msg,.small { font-size: 14px; }
.strength-bar { width: 95%; height: 10px; border: 2px solid black; background: #444; }
.strength-fill { height: 100%; width: 0%; background: #f55; }
</style>
</head>
<body>
<div class="header">Playsculpt</div>
<div class="wrapper">
<div class="side"><b>Join Playsculpt</b><p>Create games, explore worlds, and build your own creations.</p></div>
<div class="main"><div class="box-header">Create Account</div><div class="box-content">
<input id="username" maxlength="20" placeholder="Username (1-20 chars)" oninput="checkUsernameAvailability()">
<div id="username-status" class="small">Type a username to check availability.</div>
<input id="password" maxlength="100" type="password" placeholder="Password (8-100 chars)" oninput="updatePasswordStrength()">
<div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
<div id="strength-label" class="small">Strength: Weak</div>
<button class="button" onclick="signup()">Sign Up</button>
<div id="msg" class="msg"></div>
<a href="login.html" style="color:white;">Already have an account?</a>
</div></div></div>
<script>
let usernameTimer;
async function checkUsernameAvailability(){const username=document.getElementById("username").value.trim();const status=document.getElementById("username-status");clearTimeout(usernameTimer);if(!username){status.style.color="white";status.innerText="Type a username to check availability.";return;}usernameTimer=setTimeout(async()=>{const res=await fetch(`/username-available?username=${encodeURIComponent(username)}`);const data=await res.json();if(!res.ok){status.style.color="orange";status.innerText=data.error;}else{status.style.color=data.available?"lightgreen":"#ff8c8c";status.innerText=data.available?"Username is available.":"Username is taken.";}},250)}
function updatePasswordStrength(){const p=document.getElementById("password").value;const f=document.getElementById("strength-fill");const l=document.getElementById("strength-label");let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;if(p.length<8){f.style.width="20%";f.style.background="#f55";l.innerText="Strength: Weak (must be at least 8 characters)";}else if(s<=2){f.style.width="40%";f.style.background="#f55";l.innerText="Strength: Weak";}else if(s===3){f.style.width="70%";f.style.background="#ffcc33";l.innerText="Strength: Medium";}else{f.style.width="100%";f.style.background="#47d147";l.innerText="Strength: Strong";}}
async function signup(){const msg=document.getElementById("msg");const username=document.getElementById("username").value.trim();const password=document.getElementById("password").value.trim();msg.style.color="white";msg.innerText="Creating account...";const res=await fetch("/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});const data=await res.json();if(!res.ok){msg.style.color="red";msg.innerText=data.error;}else{msg.style.color="lightgreen";msg.innerText="Account created! Redirecting...";setTimeout(()=>window.location.href="/platform.html",700);}}
</script>
</body>
</html>
